<body>
    <div id="loading-text">LOADING...</div>
    <pre id="error-text"></pre>
    <div id="gameContainer"></div>

    <script>
    (() => {
        "use strict";

        /*
         * IMPORTANT :
         * Toutes les ressources proviennent du dépôt cuphead,
         * dans le dossier Build.
         *
         * Exemple :
         * https://cdn.jsdelivr.net/gh/narkos69/cuphead/Build/
         * CupheadPort.data.unityweb.part32
         */

        const REPO_URL =
            "https://cdn.jsdelivr.net/gh/narkos69/cuphead/";

        const BUILD_URL = REPO_URL + "Build/";

        const DATA_FILE = "CupheadPort.data.unityweb";
        const WASM_FILE = "CupheadPort.wasm.code.unityweb";
        const ASM_FILE = "CupheadPort.asm.code.unityweb";

        const loadingText = document.getElementById("loading-text");
        const errorText = document.getElementById("error-text");

        let loadedBytes = 0;

        function updateProgress() {
            const mb = (loadedBytes / (1024 * 1024)).toFixed(2);
            loadingText.textContent =
                `LOADING... ${mb} MB / 2101.31 MB`;
        }

        function showError(error) {
            console.error(error);
            loadingText.style.display = "none";
            errorText.style.display = "block";
            errorText.textContent =
                "Erreur pendant le chargement du jeu :\n" +
                (error?.stack || error?.message || String(error));
        }

        // Construit les URL absolues de chaque partie.
        function getParts(filename, start, end) {
            const parts = [];

            for (let i = start; i <= end; i++) {
                parts.push(
                    BUILD_URL + filename + ".part" + i
                );
            }

            return parts;
        }

        // Télécharge les parties dans l'ordre et affiche la progression.
        async function fetchWithProgress(url) {
            console.log("Téléchargement :", url);

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status} : ${url}`
                );
            }

            const buffer = await response.arrayBuffer();
            loadedBytes += buffer.byteLength;
            updateProgress();

            return buffer;
        }

        // Assemble les parties et utilise le cache si disponible.
        async function mergeFiles(fileParts, cacheKey) {
            let cache = null;

            if ("caches" in window && window.isSecureContext) {
                try {
                    cache = await caches.open("cuphead-cache-v2");

                    const cachedResponse = await cache.match(cacheKey);

                    if (cachedResponse) {
                        console.log("Depuis le cache :", cacheKey);

                        const blob = await cachedResponse.blob();
                        loadedBytes += blob.size;
                        updateProgress();

                        return URL.createObjectURL(blob);
                    }
                } catch (error) {
                    console.warn("Cache indisponible :", error);
                }
            }

            const buffers = [];

            // Téléchargement séquentiel pour éviter de lancer
            // des dizaines de gros téléchargements simultanément.
            for (const partUrl of fileParts) {
                buffers.push(await fetchWithProgress(partUrl));
            }

            const mergedBlob = new Blob(buffers);

            if (cache) {
                try {
                    await cache.put(
                        cacheKey,
                        new Response(mergedBlob)
                    );
                } catch (error) {
                    console.warn("Écriture du cache impossible :", error);
                }
            }

            return URL.createObjectURL(mergedBlob);
        }

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = url;
                script.onload = resolve;
                script.onerror = () => reject(
                    new Error("Impossible de charger le script : " + url)
                );
                document.head.appendChild(script);
            });
        }

        async function startGame() {
            try {
                // UnityLoader est chargé depuis le bon dossier Build.
                await loadScript(BUILD_URL + "UnityLoader.js");

                if (
                    typeof UnityLoader === "undefined" ||
                    typeof UnityLoader.instantiate !== "function"
                ) {
                    throw new Error("UnityLoader est indisponible.");
                }

                // Toutes les parties utilisent BUILD_URL.
                const [dataUrl, wasmUrl, asmUrl] = await Promise.all([
                    mergeFiles(
                        getParts(DATA_FILE, 1, 103),
                        DATA_FILE
                    ),
                    mergeFiles(
                        getParts(WASM_FILE, 1, 2),
                        WASM_FILE
                    ),
                    mergeFiles(
                        getParts(ASM_FILE, 1, 3),
                        ASM_FILE
                    )
                ]);

                // Intercepte les requêtes Unity pour les trois fichiers
                // assemblés et remplace leur URL par l'URL Blob.
                const originalOpen = XMLHttpRequest.prototype.open;

                XMLHttpRequest.prototype.open = function(
                    method,
                    url,
                    ...rest
                ) {
                    const requestedUrl = String(url);

                    if (requestedUrl.includes(DATA_FILE)) {
                        url = dataUrl;
                    } else if (requestedUrl.includes(WASM_FILE)) {
                        url = wasmUrl;
                    } else if (requestedUrl.includes(ASM_FILE)) {
                        url = asmUrl;
                    }

                    return originalOpen.call(
                        this,
                        method,
                        url,
                        ...rest
                    );
                };

                loadingText.textContent = "INITIALISATION...";

                // Configuration Unity également chargée depuis Build/.
                UnityLoader.instantiate(
                    "gameContainer",
                    BUILD_URL + "CupheadPort.json"
                );

                loadingText.style.display = "none";

            } catch (error) {
                showError(error);
            }
        }

        startGame();
    })();
    </script>
</body>
</html>
